name: Chore / Refactor
description: Mantenimiento, refactor, tooling, build, dependencias.
title: "[Chore]: "
labels: ["type:chore"]

body:
  - type: markdown
    attributes:
      value: |
        Para tareas que NO son bug ni feature: refactors, limpieza, build, deps, CI.
        Deben declarar explícitamente la invariante que protegen (ver RDD skill).

  - type: textarea
    id: motivacion
    attributes:
      label: Motivación
      description: ¿Por qué hace falta este chore? (deuda, build roto, perf, etc.)
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Alcance
      description: Qué archivos / áreas toca.
    validations:
      required: true

  - type: textarea
    id: invariante
    attributes:
      label: Invariante causal
      description: "Una sola oración: qué propiedad del sistema protege este cambio."
      placeholder: "El guard de solo-lectura sigue rechazando INSERT/UPDATE/DELETE y SELECT INTO."
    validations:
      required: true

  - type: dropdown
    id: impacto
    attributes:
      label: Impacto estimado en líneas
      options:
        - Pequeño (< 100 líneas)
        - Mediano (100-400 líneas, una PR)
        - Grande (> 400 líneas, requiere chain)
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Plan de rollback
      description: Cómo revertir si algo falla post-merge.
